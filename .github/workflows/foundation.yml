name: Rebuild foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/api-go/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres?sslmode=disable
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.11.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @app/shared typecheck
      - run: pnpm --filter @app/web build
      - name: Ensure demo is absent from default production assets
        run: test -z "$(find apps/web/dist -iname '*PreviewPage*')"
      - run: pnpm --filter @app/web build
        env:
          VITE_ENABLE_PREVIEW: 'true'
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/bootstrap-pilot.sh --local
      - run: docker compose --env-file .env.pilot -f compose.pilot.yaml up -d --build --wait
      - run: curl --fail --retry 5 --retry-all-errors http://localhost:18080/api/readyz
      - if: failure()
        run: docker compose --env-file .env.pilot -f compose.pilot.yaml logs --tail=100
      - if: always()
        run: docker compose --env-file .env.pilot -f compose.pilot.yaml down --volumes
